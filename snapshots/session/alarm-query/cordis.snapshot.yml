# Keyless replay counterpart: the alarm query still crosses real loopback
# HTTP; only the model adapter is replaced by the recorded-session replay.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: alarm
      name: '@deepseek-ai/dsh-integration-alarm'
    - id: alarm-query-fixture
      name: './alarm-query-fixture-server.mjs'
    - id: alarm-http
      name: '@deepseek-ai/dsh-integration-alarm-http'
      config:
        baseUrl: http://127.0.0.1:43119/
        auth: bearer
        token: snapshot-read-token
        timeoutMs: 10000
        maxResponseBytes: 1048576
        retries: 0
        retryBaseDelayMs: 100
    - id: alarm-tool
      name: '@deepseek-ai/dsh-tool-integration-alarm'
      config:
        maxAlarms: 1
        timeoutMs: 30000
        maxDetailChars: 2000
